name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: meeting-prep-generator/package-lock.json
      - name: Install Meeting Prep Generator dependencies
        working-directory: meeting-prep-generator
        run: npm ci
      - name: Build Meeting Prep Generator
        working-directory: meeting-prep-generator
        run: npm run build
      - name: Assemble Pages site
        run: |
          mkdir -p _site
          # Regulation Breach Analyzer (plain static site) serves as the site root
          cp -r regulation-breach-analyzer/. _site/
          # Meeting Prep Generator lives at a subpath of the same Pages site
          mkdir -p _site/meeting-prep-generator
          cp -r meeting-prep-generator/dist/. _site/meeting-prep-generator/
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
